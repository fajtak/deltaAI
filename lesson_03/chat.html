<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini chat s Ollamou</title>
<!--
  Mini chat pro lekci 3: celé rozhraní k lokálnímu modelu v jednom souboru.
  Spuštění (stránka musí běžet z http://localhost, ne dvojklikem ze souboru):
    cd lesson_03
    python3 -m http.server 8000        (Windows: py -m http.server 8000)
    otevři http://localhost:8000/chat.html
  Vpravo je vidět přesně to, co stránka posílá Ollamě na port 11434.
  Tlačítko „Přepsat nahrávku…“ pošle WAV/MP3 na /v1/audio/transcriptions (umí jen Gemma 4 e2b/e4b).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bp: #123f8f; --bp-dk: #0b2a63; --ink: #f4f7ff; --dim: #b4c4e6;
  --line: rgba(255,255,255,.85); --line-soft: rgba(255,255,255,.35); --faint: rgba(255,255,255,.08);
  --hi: #ffd23f; --ok: #6ef0b0; --no: #ff7a6b;
  --font: 'Bricolage Grotesque', system-ui, sans-serif;
  --mono: 'Martian Mono', Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font); color: var(--ink); background: var(--bp);
  background-image: linear-gradient(var(--faint) 1px, transparent 1px), linear-gradient(90deg, var(--faint) 1px, transparent 1px);
  background-size: 40px 40px;
  display: flex; flex-direction: column; height: 100vh; padding: 16px; gap: 12px;
}
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; border: 2px solid var(--line); padding: 12px 18px; }
header h1 { font-size: 26px; font-weight: 800; letter-spacing: -.01em; margin-right: auto; }
header h1 span { color: var(--hi); }
label, select, button, .stat { font-family: var(--mono); font-size: 13px; }
select, button { background: var(--bp-dk); color: var(--ink); border: 2px solid var(--line-soft); padding: 7px 10px; cursor: pointer; }
button:hover, select:hover { border-color: var(--hi); }
label.btn { background: var(--bp-dk); color: var(--ink); border: 2px solid var(--line-soft); padding: 7px 10px; }
label.btn:hover { border-color: var(--hi); }
label { display: flex; align-items: center; gap: 6px; color: var(--dim); cursor: pointer; }
input[type=checkbox] { accent-color: var(--hi); width: 16px; height: 16px; }
.status { font-family: var(--mono); font-size: 12px; color: var(--dim); }
.status.ok::before { content: "● "; color: var(--ok); }
.status.err::before { content: "● "; color: var(--no); }
#warn { display: none; border: 2px solid var(--no); background: rgba(255,122,107,.12); padding: 12px 16px; font-size: 16px; line-height: 1.5; }
#warn code { font-family: var(--mono); font-size: 14px; color: var(--hi); }
main { flex: 1; display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; min-height: 0; margin-top: 8px; }
.pane { border: 2px solid var(--line); display: flex; flex-direction: column; min-height: 0; position: relative; background: rgba(8,29,69,.25); }
.pane > .tag { position: absolute; top: -11px; left: 16px; background: var(--bp); padding: 0 8px; font-family: var(--mono); font-size: 12px; letter-spacing: .15em; color: var(--dim); }
#log { flex: 1; overflow-y: auto; padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 88%; padding: 10px 14px; font-size: 18px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg small { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--dim); margin-bottom: 4px; }
.msg.user { align-self: flex-end; border: 2px solid var(--hi); }
.msg.assistant { align-self: flex-start; border: 2px solid var(--line-soft); background: var(--bp-dk); }
.msg.raw { align-self: flex-start; border: 2px dashed var(--ok); background: var(--bp-dk); }
.msg.transcript { align-self: flex-start; border: 2px solid var(--ok); background: var(--bp-dk); }
.msg .think { color: var(--dim); font-size: 15px; font-style: italic; border-left: 3px solid var(--line-soft); padding-left: 10px; margin-bottom: 8px; }
.msg .think:empty { display: none; }
.msg.err { align-self: stretch; border: 2px solid var(--no); color: var(--no); font-family: var(--mono); font-size: 14px; }
form { display: flex; gap: 10px; padding: 12px; border-top: 2px solid var(--line-soft); }
textarea { flex: 1; resize: none; height: 56px; background: var(--bp-dk); color: var(--ink); border: 2px solid var(--line-soft); padding: 10px 12px; font-family: var(--font); font-size: 17px; }
textarea:focus { outline: none; border-color: var(--hi); }
form button { font-size: 14px; padding: 0 18px; border-color: var(--hi); color: var(--hi); font-weight: 600; }
.req-head { padding: 22px 16px 8px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
.stat b { color: var(--hi); font-weight: 600; }
#req { flex: 1; overflow: auto; margin: 0; padding: 8px 16px 16px; font-family: var(--mono); font-size: 13px; line-height: 1.6; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
#req .k { color: var(--hi); }
#req .s { color: var(--ok); }
@media (max-width: 800px) {
  body { height: auto; min-height: 100vh; }
  main { grid-template-columns: 1fr; }
  .pane { min-height: 60vh; }
}
</style>
</head>
<body>

<header>
  <h1>Mini chat <span>· Ollama</span></h1>
  <select id="model" title="Model z ollama list"></select>
  <label title="Holý model bez šablony a bez historie: /api/generate s raw: true"><input type="checkbox" id="raw"> raw režim</label>
  <label title="Nechá model nejdřív přemýšlet (pomalejší)"><input type="checkbox" id="think"> přemýšlení</label>
  <label class="btn" title="Přepis řeči: Gemma 4 e2b/e4b, soubor WAV nebo MP3"><input type="file" id="audio" accept="audio/*,.wav,.mp3" hidden>Přepsat nahrávku…</label>
  <button id="clear" type="button">Nový rozhovor</button>
  <span id="status" class="status">připojuji…</span>
</header>

<div id="warn"></div>

<main>
  <section class="pane">
    <span class="tag">CHAT</span>
    <div id="log"></div>
    <form id="form">
      <textarea id="input" placeholder="Napiš zprávu… (Enter odešle, Shift+Enter nový řádek)"></textarea>
      <button type="submit" id="send">Odeslat</button>
    </form>
  </section>
  <section class="pane">
    <span class="tag">CO POSÍLÁM NA LOCALHOST:11434</span>
    <div class="req-head">
      <span class="stat">adresa <b id="endpoint">–</b></span>
      <span class="stat">zpráv v historii <b id="count">0</b></span>
      <span class="stat">rychlost <b id="speed">–</b></span>
    </div>
    <pre id="req">Zatím nic. Pošli první zprávu.</pre>
  </section>
</main>

<script>
const OLLAMA = 'http://localhost:11434';
const $ = (id) => document.getElementById(id);

// Celá „paměť“ chatu: model sám nic nepamatuje, posíláme mu tohle pole pokaždé znovu.
let messages = [];
let busy = false;

// Zvýrazní klíče a texty v JSONu (bezpečně, přes escapování).
function showRequest(path, body) {
  $('endpoint').textContent = path;
  $('count').textContent = body.messages ? body.messages.length : 0;
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  $('req').innerHTML = esc(JSON.stringify(body, null, 2))
    .replace(/(&quot;|")([^"\n]*?)("\s*:)/g, '<span class="k">"$2"</span>:')
    .replace(/: "((?:[^"\\]|\\.)*)"/g, ': <span class="s">"$1"</span>');
}

function addMsg(kind, label) {
  const el = document.createElement('div');
  el.className = 'msg ' + kind;
  const s = document.createElement('small'); s.textContent = label; el.append(s);
  const think = document.createElement('div'); think.className = 'think'; el.append(think);
  const text = document.createElement('div'); el.append(text);
  $('log').append(el);
  $('log').scrollTop = $('log').scrollHeight;
  return { el, think, text };
}

function setStatus(text, ok) {
  $('status').textContent = text;
  $('status').className = 'status ' + (ok ? 'ok' : 'err');
}

// Ollama posílá odpověď po kouscích: každý řádek je jeden JSON s několika tokeny.
async function stream(path, body, onChunk) {
  const res = await fetch(OLLAMA + path, { method: 'POST', body: JSON.stringify(body) });
  if (!res.ok) throw new Error(res.status === 403
    ? '403: Ollama tuhle stránku odmítla. Otevři ji přes http://localhost, ne dvojklikem.'
    : 'Ollama vrátila chybu ' + res.status + ': ' + await res.text());
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '', last = null;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n'); buf = lines.pop();
    for (const line of lines) if (line.trim()) { last = JSON.parse(line); onChunk(last); }
  }
  if (buf.trim()) { last = JSON.parse(buf); onChunk(last); }
  if (last && last.eval_count && last.eval_duration) {
    $('speed').textContent = (last.eval_count / (last.eval_duration / 1e9)).toFixed(1) + ' tok/s';
  }
}

async function send(text) {
  busy = true; $('send').disabled = true;
  const model = $('model').value;
  addMsg('user', 'TY').text.textContent = text;
  try {
    if ($('raw').checked) {
      // RAW: holý model, žádná šablona, žádná historie. Jen „pokračuj v textu“.
      const body = { model, prompt: text, raw: true, stream: true, options: { num_predict: 80 } };
      showRequest('/api/generate', body);
      const out = addMsg('raw', 'MODEL · RAW (jen doplňuje text)');
      await stream('/api/generate', body, (c) => { out.text.textContent += c.response || ''; $('log').scrollTop = $('log').scrollHeight; });
    } else {
      // CHAT: přidáme zprávu do historie a pošleme celou historii.
      messages.push({ role: 'user', content: text });
      const body = { model, messages, think: $('think').checked, stream: true };
      showRequest('/api/chat', body);
      const out = addMsg('assistant', 'MODEL · ' + model);
      let answer = '';
      await stream('/api/chat', body, (c) => {
        if (c.message?.thinking) out.think.textContent += c.message.thinking;
        if (c.message?.content) { answer += c.message.content; out.text.textContent = answer; }
        $('log').scrollTop = $('log').scrollHeight;
      });
      messages.push({ role: 'assistant', content: answer });
      $('count').textContent = messages.length;
    }
  } catch (e) {
    if (!$('raw').checked && messages.at(-1)?.role === 'user') messages.pop();
    addMsg('err', 'CHYBA').text.textContent = e.message.includes('Failed to fetch') || e.name === 'TypeError'
      ? 'Ollama neodpovídá na localhost:11434. Běží? Zkus v terminálu: ollama list'
      : e.message;
  }
  busy = false; $('send').disabled = false; $('input').focus();
}

// Přepis řeči: soubor jde na /v1/audio/transcriptions (stejné API jako u OpenAI).
// Delší nahrávku si Ollama sama rozdělí v pauzách. Zvuk umí jen Gemma 4 e2b a e4b.
async function transcribe(file) {
  busy = true; $('send').disabled = true;
  const model = $('model').value;
  addMsg('user', 'TY · NAHRÁVKA').text.textContent = '🎙 ' + file.name + ' (' + Math.round(file.size / 1024) + ' kB)';
  $('endpoint').textContent = '/v1/audio/transcriptions';
  $('speed').textContent = '–';
  $('req').textContent = 'multipart/form-data (soubor, ne JSON)\n\n  model    = ' + model +
    '\n  language = cs\n  file     = ' + file.name + ' · ' + Math.round(file.size / 1024) + ' kB';
  const form = new FormData();
  form.append('model', model);
  form.append('language', 'cs');
  form.append('file', file);
  const t0 = performance.now();
  try {
    const res = await fetch(OLLAMA + '/v1/audio/transcriptions', { method: 'POST', body: form });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.error) throw new Error(data.error?.message || ('chyba ' + res.status));
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    addMsg('transcript', 'PŘEPIS · ' + model + ' · ' + secs + ' s').text.textContent = data.text;
    $('speed').textContent = secs + ' s přepis';
    // Přepis nabídneme do pole pro zprávu, ať se z něj dají udělat výpisky.
    $('input').value = 'Udělej z tohoto přepisu výpisky v bodech:\n\n' + data.text;
  } catch (e) {
    addMsg('err', 'CHYBA').text.textContent = 'Přepis se nepovedl: ' + e.message +
      '\nZvuk umí jen gemma4:e2b a gemma4:e4b. Zkus soubor WAV nebo MP3.';
  }
  busy = false; $('send').disabled = false; $('input').focus();
}

// Seznam stažených modelů (to samé jako „ollama list“).
async function loadModels() {
  try {
    const res = await fetch(OLLAMA + '/api/tags');
    if (!res.ok) throw new Error(res.status);
    const { models } = await res.json();
    const names = models.map((m) => m.name).sort();
    $('model').innerHTML = '';
    for (const n of names) $('model').append(new Option(n, n));
    const pick = names.find((n) => n.startsWith('gemma4:e4b')) || names.find((n) => /qwen3\.5|gemma/.test(n)) || names[0];
    if (pick) $('model').value = pick;
    setStatus(names.length + ' modelů v Ollamě', true);
  } catch (e) {
    setStatus('Ollama nedostupná', false);
    if (String(e.message) === '403') warn('Ollama odmítla přístup (403). Stránka musí běžet z <code>http://localhost</code>.');
  }
}

function warn(html) { $('warn').innerHTML = html; $('warn').style.display = 'block'; }

if (location.protocol === 'file:') {
  warn('Stránka je otevřená ze souboru, a takovým stránkám Ollama odpovídá chybou 403. ' +
       'Ve složce s tímto souborem spusť <code>python3 -m http.server 8000</code> ' +
       '(Windows: <code>py -m http.server 8000</code>) a otevři <code>http://localhost:8000/chat.html</code>.');
}

$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = $('input').value.trim();
  if (!text || busy) return;
  $('input').value = '';
  send(text);
});
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); }
});
$('clear').addEventListener('click', () => {
  messages = []; $('log').innerHTML = ''; $('count').textContent = '0';
  $('req').textContent = 'Nový rozhovor. Historie je prázdná.';
});
$('audio').addEventListener('change', (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  if (f && !busy) transcribe(f);
});
$('raw').addEventListener('change', () => { $('think').disabled = $('raw').checked; });

loadModels();
</script>
</body>
</html>
